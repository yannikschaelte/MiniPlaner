name: Release

# Push a tag "vX.Y.Z" (matching version.dat) to build all platforms and publish a GitHub release.
on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    uses: ./.github/workflows/compile.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches version.dat
        run: test "v$(cat version.dat)" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "MiniPlaner ${GITHUB_REF_NAME#v}" --generate-notes
