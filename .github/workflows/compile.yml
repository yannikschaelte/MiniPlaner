name: Compile

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_call:

# Cancel runs superseded by a newer push to the same branch or PR (but never release builds)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
      - run: meson setup .build/meson
      - run: meson compile -C .build/meson
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test (starts the app)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}meson test -C .build/meson --print-errorlogs
      - name: Package and test (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build-appimage.sh .build/meson
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a .build/dist/MiniPlaner-x86_64.AppImage --smoke-test
      - name: Package and test (macOS app)
        if: runner.os == 'macOS'
        run: |
          brew install dylibbundler
          packaging/macos/package.sh .build/meson
          .build/dist/MiniPlaner.app/Contents/MacOS/miniplaner --smoke-test
      - uses: actions/upload-artifact@v7
        with:
          name: miniplaner-${{ matrix.name }}
          path: |
            .build/dist/*.AppImage
            .build/dist/*.dmg

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-wxwidgets3.2-msw
      - run: meson setup .build/meson -Dstatic=true
      - run: meson compile -C .build/meson
      - run: meson test -C .build/meson --print-errorlogs
      - run: packaging/windows/package.sh .build/meson
      - name: Test packaged app (without the MSYS2 environment)
        shell: pwsh
        run: |
          $p = Start-Process .build\stage\miniplaner.exe -ArgumentList '--smoke-test' -Wait -PassThru
          exit $p.ExitCode
      - uses: actions/upload-artifact@v7
        with:
          name: miniplaner-Windows
          path: .build/dist/*.exe
